# note (luojiaxuan): qwen3-asr-qwen3.8-27b-customvoice on one GPU and high ports (replica 3),
# with the aligner's asr method in place of the forced-alignment worker, for the FDB comparison.
# Qwen3-ASR transcribes each utterance through its transcription endpoint, Qwen3.8-27B answers with thinking off and Qwen3-TTS CustomVoice speaks it with a built-in speaker, each a service of its own, with the VAD node beside the cascade.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/qwen3-asr-qwen3.8-27b-customvoice-bench-r3

services:
  - name: chat
    command: [python, -m, sglang.launch_server, --model-path, Qwen/Qwen3.8-27B, --port, "28233", --mem-fraction-static, "0.55"]
    port: 28233
  - name: asr
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-ASR-1.7B, --port, "28232", --mem-fraction-static, "0.16"]
    port: 28232
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice, --config, examples/configs/qwen3_tts_1_7b_customvoice.yaml, --port, "28235", --mem-fraction-static, "0.16"]
    port: 28235

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: openai_transcription
    inputs: [input, "vad:session"]
    base_url: "http://127.0.0.1:28232/v1"
    model: Qwen/Qwen3-ASR-1.7B
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    system_prompt: You are a helpful voice assistant. Answer in one spoken sentence of at most 25 words, in the language the user speaks. Do not use markdown or emoji.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:28233/v1"
    model: Qwen/Qwen3.8-27B
    max_tokens: 512
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  tts:
    kind: openai_speech
    inputs:
      - llm
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:28235/v1"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    voice: Vivian
    language: auto
  aligner:
    kind: alignment
    method: asr
    heard_asr_url: "http://127.0.0.1:28232/v1"
    heard_asr_model: Qwen/Qwen3-ASR-1.7B
    inputs: ["llm:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session", "input:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session]
  llm: [text_delta]
  tts: [pcm_f32le, session]
