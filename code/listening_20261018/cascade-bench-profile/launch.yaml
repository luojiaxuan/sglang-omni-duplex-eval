# note (luojiaxuan): qwen3-asr-qwen3-tts-customvoice on high ports, with the aligner's
# asr method in place of the forced-alignment worker, for the FDB listening run.
# Qwen3-ASR transcribes each utterance through its transcription endpoint, Qwen3-4B answers and Qwen3-TTS CustomVoice speaks it with a built-in speaker, each a service of its own, with the VAD node beside the cascade.
config_cls: StreamingCascadePipelineConfig
model_path: examples/streaming_cascade/profiles/qwen3-asr-qwen3-tts-customvoice-bench

services:
  - name: chat
    command: [python, -m, sglang.launch_server, --model-path, Qwen/Qwen3-4B-Instruct-2507, --port, "28100", --mem-fraction-static, "0.30"]
    port: 28100
  - name: asr
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-ASR-1.7B, --port, "28102", --mem-fraction-static, "0.08"]
    port: 28102
  - name: tts
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice, --config, examples/configs/qwen3_tts_1_7b_customvoice.yaml, --port, "28105", --mem-fraction-static, "0.12"]
    port: 28105

session_nodes:
  vad:
    stages: [vad]
    inputs: [input]
  asr:
    kind: openai_transcription
    inputs: [input, "vad:session"]
    base_url: "http://127.0.0.1:28102/v1"
    model: Qwen/Qwen3-ASR-1.7B
  dialog:
    kind: dialog
    inputs:
      - asr
      - {source: "llm:text_delta", feedback: true, overflow: drop_oldest, capacity: 1024}
      - {source: "tts:session", feedback: true, overflow: drop_oldest, capacity: 1024}
      - "vad:session"
      - "input:session"
      - {kind: control, source: input, event: interrupt}
      - {kind: control, source: aligner, event: reply.progress}
    system_prompt: You are a helpful voice assistant. Answer in one spoken sentence of at most 25 words, in the language the user speaks. Do not use markdown.
  llm:
    kind: openai_chat
    inputs:
      - dialog
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:28100/v1"
    model: Qwen/Qwen3-4B-Instruct-2507
    max_tokens: 512
  tts:
    kind: openai_speech
    inputs:
      - llm
      - "input:session"
      - {kind: control, source: dialog, event: interrupt}
    base_url: "http://127.0.0.1:28105/v1"
    model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    voice: Vivian
    language: auto
  aligner:
    kind: alignment
    method: asr
    heard_asr_url: "http://127.0.0.1:28102/v1"
    heard_asr_model: Qwen/Qwen3-ASR-1.7B
    inputs: ["llm:text_delta", "tts:pcm_f32le", "tts:session", "dialog:session", "input:session"]

session_publish:
  vad: [session]
  asr: [transcript]
  dialog: [session]
  llm: [text_delta]
  tts: [pcm_f32le, session]
  aligner: [session]
